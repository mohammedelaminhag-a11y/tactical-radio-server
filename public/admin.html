<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>TACTICAL COMMAND CENTER</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main id="loginBox" class="login">
        <h1>TACTICAL COMMAND</h1>
        <input type="password" id="adminPass" placeholder="PASSWORD" autocomplete="current-password" aria-label="Admin password">
        <button id="loginBtn" type="button">ACCESS SYSTEM</button>
        <div id="errorMsg" class="error" role="alert"></div>
    </main>

    <section id="dashboard" hidden>
        <header class="topbar">
            <h1>LIVE CONTROL</h1>
            <div class="topbar-right">
                <span id="connState" class="pill">OFFLINE</span>
                <span id="stats" class="pill"></span>
                <button id="logoutBtn" type="button" class="danger">LOGOUT</button>
            </div>
        </header>

        <div class="create-room-box">
            <input type="text" id="newRoomId" placeholder="CH ID" maxlength="16" aria-label="Channel ID">
            <input type="text" id="newRoomName" placeholder="NAME" maxlength="32" aria-label="Channel name">
            <input type="password" id="newRoomPass" placeholder="PASS (optional)" maxlength="64" aria-label="Channel password" autocomplete="new-password">
            <button id="createBtn" type="button">CREATE</button>
        </div>

        <div id="toast" class="toast" role="status" hidden></div>
        <div id="roomsContainer"></div>

        <h2>AUDIT LOG</h2>
        <ul id="auditList" class="audit"></ul>
    </section>

    <script src="admin.js"></script>
</body>
</html>
